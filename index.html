<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía Semanal</title>
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guía Semanal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2742">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#0f2742; --navy2:#173a5e; --ink:#16202b; --muted:#5b6876; --line:#d5dbe2; --line2:#e8ecf0;
  --bg:#f3f5f7; --card:#ffffff; --int:#1f5f9e; --int-bg:#e8f0f9; --ext:#b45309; --ext-bg:#fdf1e3;
  --ok:#1e7a45; --ok-bg:#e5f4ea; --warn:#a15c00; --warn-bg:#fff4dc; --bad:#b42318; --bad-bg:#fde9e7;
  --focus:#2f7de1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--int)}
.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace}

/* barra superior */
#top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
#top .brand{display:flex;flex-direction:column;line-height:1.15;min-width:180px}
#top .brand b{font-size:15px;letter-spacing:.06em}
#top .brand span{font-size:11px;opacity:.75;letter-spacing:.05em;text-transform:uppercase}
.weeknav{position:relative;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
.weeknav button{background:none;border:0;color:#fff;padding:5px 9px;border-radius:6px;cursor:pointer}
.weeknav button:hover{background:rgba(255,255,255,.14)}
.weeknav .wk{padding:0 8px;text-align:center;min-width:210px;line-height:1.15}
.weeknav .wk b{display:block;font-size:14px;letter-spacing:.05em}
.weeknav .wk small{opacity:.8;font-size:11.5px}
#top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who .u{text-align:right;line-height:1.15}
.who .u small{display:block;opacity:.75;font-size:11px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.b-srv{background:#1e7a45;color:#fff}.b-loc{background:#a15c00;color:#fff}.b-off{background:#b42318;color:#fff}
.b-int{background:var(--int-bg);color:var(--int)}.b-ext{background:var(--ext-bg);color:var(--ext)}
.b-admin{background:#e9e3fb;color:#5b3fb5}.b-ed{background:var(--line2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:#aab4bf;background:#fafbfc}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}.btn.pri:hover{background:var(--navy)}
.btn.ext{background:var(--ext);border-color:var(--ext);color:#fff}
.btn.danger{color:var(--bad);border-color:#f0c4bf}.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:3px 8px;font-size:12.5px}
#top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
#top .btn:hover{background:rgba(255,255,255,.2)}
#top .btn.new{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* pestañas */
#tabs{display:flex;gap:2px;padding:0 16px;background:var(--navy2);overflow-x:auto;position:sticky;top:var(--tophh,56px);z-index:19}
#tabs button{background:none;border:0;color:#cfe0f1;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:13.5px}
#tabs button:hover{color:#fff}
#tabs button.on{color:#fff;border-bottom-color:#f3b453;font-weight:600}
#tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:rgba(255,255,255,.18);font-size:11px;text-align:center}
#banner{display:none}
.bannerbox{margin:12px 16px 0;padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bannerbox.warn{background:var(--warn-bg);border:1px solid #f1d49b}
.bannerbox.info{background:var(--int-bg);border:1px solid #c5d9ef}
main{padding:16px;max-width:1500px;margin:0 auto}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{margin:0 12px 0 0;font-size:18px;letter-spacing:.02em}
.toolbar .grow{flex:1}
.toolbar select,.toolbar input[type=search]{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff;border-radius:10px;overflow:hidden}
.cal .dh{background:var(--line2);padding:6px 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .d{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px 6px;position:relative;cursor:default}
.cal .d.out{background:#fafbfc}.cal .d.out .n{opacity:.4}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--focus)}
.cal .d.selw{background:#fbfaf3}
.cal .d .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.cal .d .n{font-weight:700;font-size:13px;cursor:pointer;padding:0 4px;border-radius:4px}
.cal .d .n:hover{background:var(--line2)}
.cal .d .g{font-size:10px;color:var(--muted);letter-spacing:.04em}
.cal .d .add{position:absolute;right:4px;bottom:3px;opacity:0;border:0;background:var(--navy2);color:#fff;border-radius:5px;width:22px;height:22px;cursor:pointer;line-height:1}
.cal .d:hover .add{opacity:1}
.chip{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.25;padding:2px 5px;margin:1px 0;border-radius:4px;border:0;border-left:3px solid var(--int);background:var(--int-bg);color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ext{border-left-color:var(--ext);background:var(--ext-bg)}
.chip.anual{background:#f1f3f5;border-left-color:#8796a5;color:var(--muted)}
.chip.cx{text-decoration:line-through;opacity:.55}
.chip b{font-weight:600}
.more{font-size:11px;color:var(--muted);cursor:pointer;padding:0 5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* tablas de guía */
table.g{width:100%;min-width:900px;border-collapse:collapse;background:#fff;font-size:12.5px}
table.g th,table.g td{border:1px solid #9aa6b2;padding:4px 6px;vertical-align:top}
table.g thead th{background:#dfe5eb;font-size:11.5px;letter-spacing:.04em}
table.g td.c{text-align:center}
table.g tr.dayrow td{background:var(--navy);color:#fff;font-weight:700;letter-spacing:.05em;font-size:13px;padding:6px 8px}
table.g tr.dayrow td .gu{float:right;font-weight:600;opacity:.9}
table.g tr.dayrow td .gu.edit{cursor:pointer;text-decoration:underline dotted}
table.g tr.ev{cursor:pointer}
table.g tr.ev:hover td{background:#f6f9fc}
table.g tr.ev.ext td:first-child{box-shadow:inset 4px 0 0 var(--ext)}
table.g tr.cx td{text-decoration:line-through;color:#8a95a1}
table.g tr.empty td{color:var(--muted);font-style:italic;text-align:center}
table.g .evn{font-size:11px;color:var(--muted);display:block}
table.g .obs{margin:0;padding:0;list-style:none}
table.g .tag{font-size:10px;font-weight:700;padding:0 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.t-ext{background:var(--ext-bg);color:var(--ext)}.t-mark{background:var(--line2);color:var(--muted)}
.dochead{min-width:0;display:grid;grid-template-columns:1fr 2fr 1fr;border:1px solid #9aa6b2;background:#fff;margin-bottom:10px;font-size:12.5px}
.dochead>div{padding:8px 10px;border-right:1px solid #9aa6b2}
.dochead>div:last-child{border-right:0;text-align:right}
.dochead .ttl{text-align:center;font-weight:700;letter-spacing:.03em}
.dochead .ttl div:first-child{font-size:14px}
.firma{margin:28px 0 8px auto;text-align:center;width:300px;font-size:12.5px;line-height:1.35}
.firma .ln{border-top:1px solid #333;margin-bottom:4px}

/* planilla anual */
table.a{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
table.a th,table.a td{border:1px solid #9aa6b2;padding:5px 7px;vertical-align:top}
table.a thead th{background:#dfe5eb;position:sticky;top:calc(var(--tophh,56px) + 38px);z-index:2;font-size:11.5px;letter-spacing:.04em}
table.a tr.mes td{background:var(--line2);font-weight:700;letter-spacing:.06em;font-size:12px}
table.a tr.r{cursor:pointer}
table.a tr.r:hover td{background:#f6f9fc}
table.a tr.past td{color:#8a95a1}
table.a tr.cx td.act{text-decoration:line-through;color:#8a95a1}
table.a td.f{white-space:nowrap;font-weight:600;width:1%}
table.a td.t{width:150px;font-size:11.5px}

/* control deptos */
table.l{width:100%;border-collapse:collapse;background:#fff}
table.l th,table.l td{border-bottom:1px solid var(--line2);padding:9px 10px;text-align:left;vertical-align:middle}
table.l th{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;background:#fafbfc}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:3px 9px;border-radius:99px}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.pend{background:var(--warn-bg);color:var(--warn)}.st.sn{background:var(--line2);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ok)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,32,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.sm{width:min(440px,100%)}
.mhd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.mhd h3{margin:0;font-size:16px;flex:1}
.mbd{padding:16px 18px}
.mft{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);align-items:center;flex-wrap:wrap}
.mft .grow{flex:1}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.fg{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px}
.f>label,.lbl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%}
.f input[type=radio],.f input[type=checkbox],.alc input{width:auto;padding:0;margin:3px 0 0;flex:none}
.f input[readonly],.f textarea[readonly],.f select:disabled{background:#f6f7f9}
.f textarea{resize:vertical;min-height:70px}
.f .hint{font-size:11.5px;color:var(--muted)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
.quick{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.quick button{font-size:11.5px;padding:2px 7px;border:1px solid var(--line);background:#fafbfc;border-radius:5px;cursor:pointer}
.alc{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.alc label{flex:1;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer;font-size:13px;line-height:1.3}
.alc label+label{border-left:1px solid var(--line)}
.alc input{margin-top:3px}
.alc label.on.int{background:var(--int-bg);box-shadow:inset 0 -3px 0 var(--int)}
.alc label.on.ext{background:var(--ext-bg);box-shadow:inset 0 -3px 0 var(--ext)}
.alc b{display:block}
.alc small{color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin:-6px 0 14px}
.subtabs button{border:0;background:none;padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--navy2);font-weight:600}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.hist div{margin-bottom:10px;font-size:12.5px}
.hist b{font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* registro */
table.log{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
table.log th,table.log td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
table.log th{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;background:#fafbfc;position:sticky;top:calc(var(--tophh,56px) + 38px)}
.ac{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.ac.crear{color:var(--ok)}.ac.editar{color:var(--int)}.ac.eliminar,.ac.anular{color:var(--bad)}.ac.confirmar{color:#5b3fb5}.ac.login{color:var(--muted)}

/* admin */
.adm{display:grid;grid-template-columns:200px 1fr;gap:16px}
.adm nav{display:flex;flex-direction:column;gap:2px}
.adm nav button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.adm nav button.on{background:#fff;border:1px solid var(--line);font-weight:600}
.adm h3{margin:0 0 12px;font-size:16px}
.rowlist .ri{display:flex;gap:8px;margin-bottom:6px}
.rowlist .ri input{border:1px solid var(--line);border-radius:7px;padding:6px 8px}

.days{display:flex;gap:6px;flex-wrap:wrap}.day{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}.day.me{background:var(--int-bg);border-color:#c5d9ef;font-weight:600}
.connect{max-width:720px;margin:30px auto}.connect p{line-height:1.5}.btn.big{padding:10px 18px;font-size:15px}
.f>label.chk,.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1d2733;color:#fff;padding:9px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13.5px}
#toast div.e{background:var(--bad)}
#printframe{position:fixed;width:0;height:0;border:0;right:0;bottom:0}

@media (max-width:860px){
  .fg .c8,.fg .c6,.fg .c4,.fg .c3,.fg .c2{grid-column:span 12}
  .adm{grid-template-columns:1fr}.adm nav{flex-direction:row;overflow-x:auto}
  .cal .d{min-height:80px}.chip{font-size:10.5px}
  .weeknav .wk{min-width:0}
  table.g{font-size:11.5px}
  .dochead{grid-template-columns:1fr}.dochead>div{border-right:0;border-bottom:1px solid #9aa6b2;text-align:center !important}
}
@media print{ body>*:not(#printframe){display:none !important} }
</style>
</head>
<body>
<header id="top">
  <div class="brand"><b id="brandShip">GUÍA SEMANAL</b><span id="brandSub">Oficina de Operaciones</span></div>
  <div class="weeknav" title="Semana seleccionada">
    <button id="wPrev" aria-label="Semana anterior">◀</button>
    <div class="wk"><b id="wkLabel">SEMANA —</b><small id="wkRange"></small></div>
    <button id="wNext" aria-label="Semana siguiente">▶</button>
    <button id="wToday" title="Ir a la semana actual">Hoy</button>
    <input type="date" id="wPick" style="width:26px;opacity:.0;position:absolute;pointer-events:none" tabindex="-1">
  </div>
  <div class="spacer"></div>
  <span id="modeBadge" class="badge b-srv">—</span>
  <button class="btn new" id="btnNew" style="display:none">＋ Nueva actividad</button>
  <div class="who" id="who"></div>
</header>
<nav id="tabs"></nav>
<div id="banner"></div>
<main id="view"></main>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<iframe id="printframe" title="impresión"></iframe>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   GUÍA SEMANAL — v2.1
   Una sola página, sin dependencias externas ni servidor.
   Se abre desde la carpeta compartida del buque (Edge o Chrome) y guarda ahí mismo,
   en la subcarpeta datos/. Multiusuario con registro de cambios.
   ═══════════════════════════════════════════════════════════════════ */
const APP_VERSION = "2.1";
const MES_C = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const MES_L = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const DIA_L = ["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
const DIA_C = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];

/* ─────────────── utilidades */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayIso = () => iso(new Date());
const dow = s => parse(s).getDay();
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const monday = s => { const d = parse(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); };
function isoWeek(s){ const d = parse(s); d.setDate(d.getDate() + 3 - (d.getDay()+6)%7); const y = d.getFullYear();
  const w1 = new Date(y,0,4); return { year:y, week: 1 + Math.round(((d - w1)/86400000 - 3 + (w1.getDay()+6)%7)/7) }; }
function firstMonday(y){ const d = new Date(y,0,1); while (d.getDay()!==1) d.setDate(d.getDate()+1); return iso(d); }
/* número de semana: por defecto la semana 1 comienza el primer lunes del año (criterio de la guía); opcional ISO 8601 */
function weekNum(mon){
  if ((S.config||{}).numeracionSemana === "iso") return isoWeek(mon);
  let y = +mon.slice(0,4); if (mon < firstMonday(y)) y--;
  return { year:y, week: 1 + Math.floor(daysBetween(firstMonday(y), mon)/7) };
}
const weekId = mon => mon;   /* identificador interno de la semana = fecha del lunes */
const fmtC = s => { const d = parse(s); return `${pad(d.getDate())} ${MES_C[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${DIA_L[d.getDay()]} ${pad(d.getDate())} DE ${MES_L[d.getMonth()]} ${d.getFullYear()}`; };
const fmtTs = ts => ts ? `${ts.slice(8,10)}-${ts.slice(5,7)}-${ts.slice(0,4)} ${ts.slice(11,16)}` : "";
const lastDay = (y, m) => new Date(y, m+1, 0).getDate();

const uid = () => Math.random().toString(16).slice(2,8) + Date.now().toString(16).slice(-6);

/* ═══════════════ ALMACENAMIENTO EN CARPETA COMPARTIDA ═══════════════
   · Cada cambio se guarda como un archivo propio en  datos/cambios/  → dos personas guardando
     al mismo tiempo nunca se sobrescriben.
   · Cada PC relee la carpeta cada 10 s y aplica los cambios nuevos en orden.
   · datos/estado.json = foto consolidada para abrir rápido.  datos/respaldos/ = copia diaria.
   · No requiere servidor, red especial ni permisos de firewall: solo acceso a la carpeta.  */
const IDB_NAME = "guiaSemanal", IDB_STORE = "handles";
function idb(){ return new Promise((ok,ko)=>{ const q = indexedDB.open(IDB_NAME,1); q.onupgradeneeded = ()=> q.result.createObjectStore(IDB_STORE); q.onsuccess = ()=> ok(q.result); q.onerror = ()=> ko(q.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise(ok=>{ const r = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(k); r.onsuccess = ()=> ok(r.result); r.onerror = ()=> ok(null); }); } catch(e){ return null; } }
async function idbSet(k, v){ try { const db = await idb(); await new Promise((ok,ko)=>{ const tx = db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete = ok; tx.onerror = ()=> ko(tx.error); }); } catch(e){} }
const ses = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };

class FolderAdapter {
  constructor(root){ this.root = root; this.kind = "carpeta"; this.label = root.name; this.canWrite = false; }
  /* devuelve false si la carpeta no tiene datos de la guía y create=false */
  async init(create){
    let datos = null;
    try { datos = await this.root.getDirectoryHandle("datos"); } catch(e){}
    if (!datos){ try { await this.root.getDirectoryHandle("cambios"); datos = this.root; } catch(e){} }   // eligió la subcarpeta "datos"
    if (!datos){ if (!create) return false; datos = await this.root.getDirectoryHandle("datos", {create:true}); }
    this.datos = datos;
    try { this.cambios = await datos.getDirectoryHandle("cambios"); } catch(e){ this.cambios = await datos.getDirectoryHandle("cambios", {create:true}); }
    try { this.canWrite = (await this.root.queryPermission({mode:"readwrite"})) === "granted"; } catch(e){ this.canWrite = true; }
    return true;
  }
  async list(){ const out = []; for await (const [n,h] of this.cambios.entries()) if (h.kind === "file" && n.endsWith(".json")) out.push(n); return out; }
  async _read(dir, name){ const f = await (await dir.getFileHandle(name)).getFile(); return JSON.parse(await f.text()); }
  async _write(dir, name, obj){ const fh = await dir.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(JSON.stringify(obj)); await w.close(); }
  readChange(n){ return this._read(this.cambios, n); }
  writeChange(n, o){ return this._write(this.cambios, n, o); }
  async readSnap(){ try { return await this._read(this.datos, "estado.json"); } catch(e){ return null; } }
  writeSnap(o){ return this._write(this.datos, "estado.json", o); }
  async writeBackup(name, o, onlyIfMissing){
    const d = await this.datos.getDirectoryHandle("respaldos", {create:true});
    if (onlyIfMissing){ try { await d.getFileHandle(name); return false; } catch(e){} }
    await this._write(d, name, o); return true;
  }
}
class BrowserAdapter {   // alternativa: solo este navegador (sin compartir)
  constructor(){ this.kind = "navegador"; this.label = "este navegador"; this.key = "guiaSemanal.cambios.v2"; this.canWrite = true; }
  async init(){ return true; }
  _all(){ try { return JSON.parse(store.get(this.key) || "{}"); } catch(e){ return {}; } }
  async list(){ return Object.keys(this._all()); }
  async readChange(n){ return this._all()[n]; }
  async writeChange(n, o){ const a = this._all(); a[n] = o; if (!store.set(this.key, JSON.stringify(a))) throw new Error("El navegador no permitió guardar (almacenamiento lleno o bloqueado)"); }
  async readSnap(){ return null; } async writeSnap(){} async writeBackup(){ return false; }
}

class DataStore {
  constructor(adapter){
    this.a = adapter; this.known = new Set(); this.d = this.empty(); this.audit = []; this.rev = 0; this.lastStamp = 0; this.snapCount = 0;
    try { this.sesiones = JSON.parse(ses.get("guiaSemanal.sesiones") || "{}"); } catch(e){ this.sesiones = {}; }
  }
  empty(){ return {config:JSON.parse(JSON.stringify(DEFAULT_CONFIG)), deptos:DEFAULT_DEPTOS.slice(), events:{}, checkins:{}, semanas:{}, usuarios:{}, plantillas:{}}; }
  async open(){
    const snap = await this.a.readSnap();
    if (snap && snap.v === 2 && snap.d){
      this.d = Object.assign(this.empty(), snap.d); (snap.incluidos||[]).forEach(n=> this.known.add(n));
      this.audit = snap.auditoria || []; this.snapCount = this.known.size;
    }
    await this.sync();
    if (!Object.keys(this.d.usuarios).length && this.a.canWrite){
      const salt = uid();
      await this.commit({usuario:"sistema", accion:"crear", coll:"usuarios", docid:"admin", resumen:"Usuario inicial admin / admin (debe cambiar la clave)"},
        [{t:"usr", v:{usuario:"admin", nombre:"Administrador", depto:"OPERACIONES", rol:"admin", activo:true, salt, hash:await DataStore.hash("admin",salt), debeCambiar:true}}]);
    }
    this.maintenance();
  }
  static async hash(pw, salt){
    const txt = salt + "|" + pw;
    if (window.crypto && crypto.subtle){
      let buf = new TextEncoder().encode(txt);
      for (let i=0;i<500;i++) buf = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
      return [...buf].map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    let h1 = 0x811c9dc5, h2 = 0x1234567; for (let r=0;r<2000;r++) for (let i=0;i<txt.length;i++){ h1 = Math.imul(h1 ^ txt.charCodeAt(i), 16777619); h2 = Math.imul(h2 + txt.charCodeAt(i), 2654435761); }
    return (h1>>>0).toString(16) + (h2>>>0).toString(16);
  }
  apply(op){
    const D = this.d;
    switch(op.t){
      case "ev": D.events[op.v.id] = op.v; break;          case "evdel": delete D.events[op.id]; break;
      case "ck": D.checkins[op.v.id] = op.v; break;        case "ckdel": delete D.checkins[op.id]; break;
      case "cfg": D.config = Object.assign({}, D.config, op.v); break;
      case "dep": D.deptos = op.v; break;
      case "sem": D.semanas[op.v.id] = op.v; break;
      case "usr": D.usuarios[op.v.usuario] = op.v; break;  case "usrdel": delete D.usuarios[op.id]; break;
      case "pl": D.plantillas[op.v.id] = op.v; break;      case "pldel": delete D.plantillas[op.id]; break;
      case "reset": D.events = {}; D.checkins = {}; D.semanas = {}; D.plantillas = {}; break;
    }
  }
  /* lee de la carpeta los cambios que aún no conoce; devuelve true si hubo novedades */
  async sync(){
    const names = (await this.a.list()).filter(n=> !this.known.has(n)).sort();
    if (!names.length) return false;
    for (const n of names){
      let c; try { c = await this.a.readChange(n); } catch(e){ continue; }   // archivo aún escribiéndose → próximo ciclo
      this.known.add(n);
      if (!c || !Array.isArray(c.ops)) continue;
      c.ops.forEach(op=> this.apply(op));
      this.audit.push({n, ts:c.ts, usuario:c.usuario, accion:c.accion, coll:c.coll, docid:c.docid, resumen:c.resumen});
    }
    this.audit.sort((a,b)=> a.n < b.n ? -1 : 1); this.rev++;
    return true;
  }
  now(){ const d = new Date(); return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  async commit(meta, ops){
    if (!this.a.canWrite) throw new Error("Esta carpeta está abierta en solo lectura. Reconecte la carpeta con permiso de edición.");
    let stamp = Date.now(); if (stamp <= this.lastStamp) stamp = this.lastStamp + 1; this.lastStamp = stamp;
    const ts = this.now(), n = `${String(stamp).padStart(14,"0")}_${String(meta.usuario||"x").replace(/[^a-z0-9]/gi,"").slice(0,20)}_${uid().slice(0,6)}.json`;
    try { await this.a.writeChange(n, Object.assign({v:2, ts}, meta, {ops})); }
    catch(e){ throw new Error("No se pudo guardar en la carpeta compartida. Verifique que la carpeta está disponible y que tiene permiso de escritura. (" + (e.message || e.name) + ")"); }
    ops.forEach(op=> this.apply(op)); this.known.add(n);
    this.audit.push({n, ts, usuario:meta.usuario, accion:meta.accion, coll:meta.coll, docid:meta.docid, resumen:meta.resumen}); this.rev++;
  }
  snapshot(){ return {v:2, generado:this.now(), incluidos:[...this.known].sort(), d:this.d, auditoria:this.audit}; }
  /* foto consolidada cada 40 cambios + respaldo diario (lo hace el primer PC que abra la guía en el día) */
  async maintenance(){
    if (!this.a.canWrite || this.a.kind !== "carpeta") return;
    try { if (this.known.size - this.snapCount >= 40){ await this.a.writeSnap(this.snapshot()); this.snapCount = this.known.size; } } catch(e){}
    try { await this.a.writeBackup(`respaldo_${todayIso()}.json`, this.backupObj("automático"), true); } catch(e){}
  }
  backupObj(por){ const D = this.d; return {formato:"guia-semanal-respaldo", version:2, generado:this.now(), generadoPor:por, config:D.config, deptos:D.deptos,
      events:Object.values(D.events), checkins:Object.values(D.checkins), semanas:Object.values(D.semanas), usuarios:Object.values(D.usuarios), plantillas:Object.values(D.plantillas), auditoria:this.audit}; }
  pub(u){ const {usuario,nombre,depto,rol,activo,debeCambiar} = u; return {usuario,nombre,depto,rol,activo,debeCambiar}; }
  saveSes(){ ses.set("guiaSemanal.sesiones", JSON.stringify(this.sesiones)); }

  async handle(method, path, body, token){
    const [pp, qs] = path.split("?"); const q = new URLSearchParams(qs||"");
    const parts = pp.replace(/^\/api\//,"").split("/"); const name = parts[0], arg = parts.slice(1).join("/") ? decodeURIComponent(parts.slice(1).join("/")) : null;
    const ok = data => ({status:200, data}), err = (s,m) => ({status:s, data:{error:m}});
    const isMut = method !== "GET" && !["login","logout"].includes(name);
    if (isMut){ try { await this.sync(); } catch(e){ return err(503, "La carpeta compartida no está disponible: " + (e.message||e.name)); } }
    const D = this.d, sx = this.sesiones[token];
    const user = sx && sx.exp > Date.now() && D.usuarios[sx.usuario] && D.usuarios[sx.usuario].activo !== false ? D.usuarios[sx.usuario] : null;
    const need = admin => !user ? err(401,"Debe iniciar sesión") : (admin && user.rol !== "admin" ? err(403,"Solo el administrador puede hacer esto") : null);
    const U = user && user.usuario, k = method + " " + name;
    const C = (accion, coll, docid, resumen, ops) => this.commit({usuario:U, accion, coll, docid, resumen}, ops);
    try {
      switch(k){
      case "GET estado": return ok({modo:this.a.kind, rev:this.rev, config:D.config, deptos:D.deptos, events:Object.values(D.events), checkins:Object.values(D.checkins),
          semanas:Object.values(D.semanas), plantillas:Object.values(D.plantillas), usuarios:Object.values(D.usuarios).map(u=>this.pub(u))});
      case "GET auditoria": { let a = this.audit.slice().reverse(); if (q.get("doc")) a = a.filter(x=> x.docid === q.get("doc")); return ok(a.slice(0, +(q.get("limite")||1000))); }
      case "POST login": { const u = D.usuarios[(body.usuario||"").trim().toLowerCase()];
        if (!u || u.activo === false || await DataStore.hash(body.clave||"", u.salt) !== u.hash) return err(401,"Usuario o clave incorrectos");
        const t = uid() + uid(); this.sesiones[t] = {usuario:u.usuario, exp:Date.now() + 12*3600e3}; this.saveSes(); return ok({token:t, usuario:this.pub(u)}); }
      case "POST logout": delete this.sesiones[token]; this.saveSes(); return ok({ok:true});
      case "GET yo": return ok({usuario: user ? this.pub(user) : null});
      case "PUT clave": { const e = need(); if (e) return e;
        if (await DataStore.hash(body.actual||"", user.salt) !== user.hash) return err(400,"La clave actual no es correcta");
        if ((body.nueva||"").length < 6) return err(400,"La clave nueva debe tener al menos 6 caracteres");
        const nu = Object.assign({}, user, {salt:uid()}); nu.hash = await DataStore.hash(body.nueva, nu.salt); nu.debeCambiar = false;
        await C("editar","usuarios",U,"Cambió su clave",[{t:"usr", v:nu}]); return ok({ok:true, usuario:this.pub(nu)}); }

      case "POST eventos": { const e = need(); if (e) return e; const ev = cleanEvent(body);
        if (user.rol !== "admin") ev.depto = user.depto; ev.id = uid(); ev.creado = ev.modificado = this.now(); ev.creadoPor = ev.modificadoPor = U;
        await C("crear","events",ev.id,`${ev.fechaInicio} · ${ev.actividad}`,[{t:"ev", v:ev}]); return ok({evento:ev}); }
      case "PUT eventos": { const e = need(); if (e) return e; const old = D.events[arg]; if (!old) return err(404,"El evento no existe (puede haber sido eliminado)");
        if (user.rol !== "admin" && old.depto !== user.depto) return err(403,`Este evento pertenece al depto. ${old.depto}; solo ese depto o el administrador pueden editarlo`);
        if (body._modificado && body._modificado !== old.modificado) return err(409,`${old.modificadoPor} modificó este evento a las ${String(old.modificado).slice(11,16)}. Cierre y vuelva a abrirlo.`);
        const ev = cleanEvent(body, old); if (user.rol !== "admin") ev.depto = user.depto; ev.modificado = this.now(); ev.modificadoPor = U;
        await C("editar","events",arg,`${ev.actividad} — ${diffSummary(old,ev) || "sin cambios"}`,[{t:"ev", v:ev}]); return ok({evento:ev}); }
      case "DELETE eventos": { const e = need(); if (e) return e; const old = D.events[arg]; if (!old) return err(404,"El evento no existe");
        if (user.rol !== "admin" && old.depto !== user.depto) return err(403,"No puede eliminar eventos de otro departamento");
        await C("eliminar","events",arg,`${old.fechaInicio} · ${old.actividad}`,[{t:"evdel", id:arg}]); return ok({ok:true}); }

      case "POST plantillas": { const e = need(); if (e) return e; const old = body.id ? D.plantillas[body.id] : null;
        if (old && user.rol !== "admin" && old.depto !== user.depto) return err(403,"Esa actividad guardada pertenece a otro departamento");
        const p = cleanTemplate(body, old); if (user.rol !== "admin") p.depto = user.depto;
        p.id = old ? old.id : uid(); p.modificado = this.now(); p.modificadoPor = U; if (!old){ p.creado = p.modificado; p.creadoPor = U; }
        await C(old?"editar":"crear","plantillas",p.id,`Actividad guardada: ${p.actividad}`,[{t:"pl", v:p}]); return ok({plantilla:p}); }
      case "DELETE plantillas": { const e = need(); if (e) return e; const old = D.plantillas[arg]; if (!old) return err(404,"No existe");
        if (user.rol !== "admin" && old.depto !== user.depto) return err(403,"Esa actividad guardada pertenece a otro departamento");
        await C("eliminar","plantillas",arg,`Actividad guardada: ${old.actividad}`,[{t:"pldel", id:arg}]); return ok({ok:true}); }

      case "POST checkins": { const e = need(); if (e) return e; if (user.rol !== "admin" && body.depto !== user.depto) return err(403,"Solo puede registrar el ingreso de su propio departamento");
        const id = `${body.semana}|${body.depto}`;
        const c = {id, semana:body.semana, depto:body.depto, usuario:U, nombre:user.nombre, ts:this.now(), nota:(body.nota||"").trim(), sinNovedad:!!body.sinNovedad};
        await C("confirmar","checkins",id,`${c.depto} confirmó ingreso de requerimientos semana ${body.etiqueta||c.semana}${c.sinNovedad?" (sin novedad)":""}`,[{t:"ck", v:c}]); return ok({checkin:c}); }
      case "DELETE checkins": { const e = need(); if (e) return e; const old = D.checkins[arg]; if (!old) return err(404,"No existe");
        if (user.rol !== "admin" && old.depto !== user.depto) return err(403,"No autorizado");
        await C("anular","checkins",arg,`Anuló confirmación ${old.depto} semana ${old.semana}`,[{t:"ckdel", id:arg}]); return ok({ok:true}); }

      case "PUT config": { const e = need(true); if (e) return e;
        const ch = Object.keys(body).filter(x=> JSON.stringify(D.config[x]) !== JSON.stringify(body[x]));
        await C("editar","config","main","Configuración: " + (ch.join(", ") || "sin cambios"),[{t:"cfg", v:body}]); return ok({config:D.config}); }
      case "PUT deptos": { const e = need(true); if (e) return e;
        const l = (body.lista||[]).filter(x=>x.codigo).map(x=>({codigo:String(x.codigo).trim().toUpperCase(), nombre:String(x.nombre||"").trim()}));
        if (!l.length) return err(400,"Debe existir al menos un departamento");
        await C("editar","deptos","lista","Departamentos: " + l.map(x=>x.codigo).join(", "),[{t:"dep", v:l}]); return ok({deptos:l}); }
      case "PUT semanas": { const e = need(true); if (e) return e;
        const s = Object.assign({id:arg}, D.semanas[arg]||{}, body, {id:arg, modificado:this.now(), modificadoPor:U});
        await C("editar","semanas",arg,`Semana ${arg}: versión ${s.version||""}${s.publicada?" — PUBLICADA":""}`,[{t:"sem", v:s}]); return ok({semana:s}); }

      case "GET usuarios": { const e = need(true); if (e) return e; return ok(Object.values(D.usuarios).map(u=>this.pub(u))); }
      case "POST usuarios": { const e = need(true); if (e) return e; const n = (body.usuario||"").trim().toLowerCase();
        if (!n || /\s/.test(n)) return err(400,"Nombre de usuario inválido (sin espacios)"); if (D.usuarios[n]) return err(400,"Ese usuario ya existe");
        if ((body.clave||"").length < 6) return err(400,"La clave debe tener al menos 6 caracteres");
        const salt = uid(), nu = {usuario:n, nombre:(body.nombre||n).trim(), depto:body.depto||"", rol:body.rol==="admin"?"admin":"editor", activo:true, salt, hash:await DataStore.hash(body.clave,salt), debeCambiar:true};
        await C("crear","usuarios",n,`Creó usuario ${n} (${nu.rol}, ${nu.depto})`,[{t:"usr", v:nu}]); return ok({usuario:this.pub(nu)}); }
      case "PUT usuarios": { const e = need(true); if (e) return e; const u = D.usuarios[arg]; if (!u) return err(404,"Usuario no existe");
        const nu = Object.assign({}, u); ["nombre","depto"].forEach(x=>{ if (x in body) nu[x] = body[x]; });
        if ("rol" in body) nu.rol = body.rol === "admin" ? "admin" : "editor"; if ("activo" in body) nu.activo = !!body.activo;
        const ch = ["nombre","depto","rol","activo"].filter(x=> u[x] !== nu[x]);
        if (body.clave){ if (body.clave.length < 6) return err(400,"La clave debe tener al menos 6 caracteres"); nu.salt = uid(); nu.hash = await DataStore.hash(body.clave, nu.salt); nu.debeCambiar = true; ch.push("clave reiniciada"); }
        if (arg === U && (nu.rol !== "admin" || !nu.activo)) return err(400,"No puede quitarse a sí mismo el rol de administrador");
        await C("editar","usuarios",arg,`Usuario ${arg}: ${ch.join(", ") || "sin cambios"}`,[{t:"usr", v:nu}]); return ok({usuario:this.pub(nu)}); }
      case "DELETE usuarios": { const e = need(true); if (e) return e; if (arg === U) return err(400,"No puede eliminarse a sí mismo");
        await C("eliminar","usuarios",arg,`Eliminó usuario ${arg}`,[{t:"usrdel", id:arg}]); return ok({ok:true}); }

      case "GET respaldo": { const e = need(true); if (e) return e; return ok(this.backupObj(U)); }
      case "POST respaldar": { const e = need(true); if (e) return e; if (this.a.kind !== "carpeta") return err(400,"Sin carpeta conectada: use «Descargar respaldo»");
        const nm = `respaldo_${todayIso()}_${pad(new Date().getHours())}${pad(new Date().getMinutes())}_manual.json`; await this.a.writeBackup(nm, this.backupObj(U), false); return ok({archivo:nm}); }
      case "POST restaurar": { const e = need(true); if (e) return e; const data = body.datos || {}, modo = body.modo || "fusionar";
        if (data.formato !== "guia-semanal-respaldo") return err(400,"El archivo no es un respaldo válido de la Guía Semanal");
        if (this.a.kind === "carpeta"){ try { await this.a.writeBackup(`respaldo_${todayIso()}_antes-de-restaurar_${uid().slice(0,4)}.json`, this.backupObj(U), false); } catch(x){} }
        const ops = [];
        if (modo === "reemplazar"){ ops.push({t:"reset"}); if (data.config) ops.push({t:"cfg", v:data.config}); if (data.deptos) ops.push({t:"dep", v:data.deptos});
          (data.usuarios||[]).forEach(u=>{ if (u.usuario && u.hash) ops.push({t:"usr", v:u}); }); }
        let n = 0; (data.events||[]).forEach(ev=>{ if (ev.id && ev.fechaInicio){ ops.push({t:"ev", v:ev}); n++; } });
        (data.checkins||[]).forEach(c=>{ if (c.id) ops.push({t:"ck", v:c}); }); (data.semanas||[]).forEach(s=>{ if (s.id) ops.push({t:"sem", v:s}); });
        let np = 0; (data.plantillas||[]).forEach(p=>{ if (p.id && p.actividad){ ops.push({t:"pl", v:p}); np++; } });
        if (data.guardias) ops.push({t:"cfg", v:{guardiaOverrides:Object.assign({}, D.config.guardiaOverrides||{}, data.guardias)}});
        await C("restaurar","sistema","",`Restauración (${modo}) — ${n} eventos y ${np} actividades guardadas desde «${data.origen||data.generado||"archivo"}»`, ops);
        return ok({ok:true, eventos:n, plantillas:np}); }
      }
      return err(404,"Ruta no válida");
    } catch(ex){ return err(400, ex.message || String(ex)); }
  }
}

const EVENT_FIELDS = ["ev","fechaInicio","fechaFin","horaInicio","horaFin","actividad","responsable","lugar","participantes","observaciones","tipo","alcance","depto","mostrar","enAnual","estado","recurrencia","orden"];
const FIELD_LABEL = {fechaInicio:"fecha inicio",fechaFin:"fecha término",horaInicio:"hora inicio",horaFin:"hora término",enAnual:"en planilla anual",mostrar:"mostrar en guía",alcance:"interno/externo"};
function cleanEvent(src, old){
  const ev = Object.assign({}, old||{}); EVENT_FIELDS.forEach(k=>{ if (k in src) ev[k] = src[k]; });
  ["actividad","responsable","lugar","participantes","observaciones","tipo","horaInicio","horaFin","ev"].forEach(k=> ev[k] = String(ev[k]??"").trim());
  ev.actividad = ev.actividad.toUpperCase();
  if (!ev.fechaInicio) throw new Error("Falta la fecha de inicio");
  if (!ev.actividad) throw new Error("Falta la actividad");
  ev.fechaFin = ev.fechaFin || ev.fechaInicio; if (ev.fechaFin < ev.fechaInicio) throw new Error("La fecha de término es anterior a la de inicio");
  ev.alcance = ev.alcance==="EXT" ? "EXT" : "INT"; ev.mostrar = ["diario","habiles","extremos","anual"].includes(ev.mostrar) ? ev.mostrar : "diario";
  ev.estado = ev.estado==="cancelado" ? "cancelado" : "activo"; ev.enAnual = !!ev.enAnual; ev.ev = ev.ev || "PT";
  if (!ev.recurrencia || typeof ev.recurrencia !== "object") ev.recurrencia = {tipo:"ninguna"};
  return ev;
}
const TPL_FIELDS = ["actividad","horaInicio","horaFin","responsable","lugar","participantes","observaciones","alcance","mostrar","enAnual","depto","ev"];
function cleanTemplate(src, old){
  const p = Object.assign({}, old||{}); TPL_FIELDS.forEach(k=>{ if (k in src) p[k] = src[k]; });
  ["actividad","horaInicio","horaFin","responsable","lugar","participantes","observaciones","ev"].forEach(k=> p[k] = String(p[k]??"").trim().toUpperCase());
  if (!p.actividad) throw new Error("Falta el nombre de la actividad");
  p.alcance = p.alcance === "EXT" ? "EXT" : "INT"; p.mostrar = ["diario","habiles","extremos","anual"].includes(p.mostrar) ? p.mostrar : "diario"; p.enAnual = !!p.enAnual; p.ev = p.ev || "PT";
  return p;
}
function diffSummary(a, b){
  const n = v => (v===undefined||v===null) ? "" : v;
  return EVENT_FIELDS.filter(k=>JSON.stringify(n(a[k]))!==JSON.stringify(n(b[k]))).map(k=>{
    const va=a[k], vb=b[k]; return (typeof va==="object"||typeof vb==="object") ? (FIELD_LABEL[k]||k) : `${FIELD_LABEL[k]||k}: «${va||"—"}» → «${vb||"—"}»`; }).join("; ");
}

/* ═══════════════ lógica de calendario/guía ═══════════════ */
const deptoName = c => (S.deptos.find(d=>d.codigo===c)||{}).nombre || c || "—";
function guardiaFor(s){
  const o = (S.config.guardiaOverrides||{})[s]; if (o) return o;
  const g = S.config.guardias||[]; if (!g.length || !S.config.guardiaAncla) return "";
  const n = daysBetween(S.config.guardiaAncla, s); return g[((n % g.length) + g.length) % g.length];
}
function recurMatch(r, s){
  const d = parse(s), wd = d.getDay();
  switch(r.tipo){
    case "diaria": return true;
    case "habiles": return wd>=1 && wd<=5;
    case "semanal": return (r.dias||[]).includes(wd);
    case "mensual": return d.getDate() === Math.min(+r.dia||1, lastDay(d.getFullYear(), d.getMonth()));
    case "ultimoHabil": return s === lastBusiness(d.getFullYear(), d.getMonth());
  }
  return false;
}
function recurText(r){
  switch(r && r.tipo){
    case "diaria": return "TODOS LOS DÍAS"; case "habiles": return "DE LUNES A VIERNES";
    case "semanal": return "CADA " + (r.dias||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>DIA_L[i]).join(", ");
    case "mensual": return `DÍA ${r.dia} DE CADA MES`; case "ultimoHabil": return "ÚLTIMO DÍA HÁBIL DE CADA MES";
  }
  return "";
}
/* fechas en que un evento aparece entre from..to.  forGuide=true excluye los "solo planilla anual". */
function occurrences(ev, from, to, forGuide){
  const fi = ev.fechaInicio, ff = ev.fechaFin || fi;
  const a = fi > from ? fi : from, b = ff < to ? ff : to; if (a > b) return [];
  const r = ev.recurrencia || {tipo:"ninguna"}; const out = [];
  if (forGuide && ev.mostrar === "anual") return [];
  if (r.tipo && r.tipo !== "ninguna"){ for (let s=a; s<=b; s=addDays(s,1)) if (recurMatch(r,s)) out.push({fecha:s, marca:""}); return out; }
  if (ev.mostrar === "diario" || ev.mostrar === "habiles"){ for (let s=a; s<=b; s=addDays(s,1)){ const wd = dow(s); if (ev.mostrar==="habiles" && (wd===0||wd===6)) continue; out.push({fecha:s, marca:""}); } return out; }
  if (fi >= from && fi <= to) out.push({fecha:fi, marca: fi!==ff ? "INICIO" : ""});
  if (ff !== fi && ff >= from && ff <= to) out.push({fecha:ff, marca:"TÉRMINO"});
  return out;
}
function horaKey(ev){
  const h = String(ev.horaInicio||"").trim().toUpperCase();
  if (isNumHora(h)){ const v = h.padStart(4,"0"); return 100 + (+v.slice(0,2))*60 + (+v.slice(2)); }
  if (h === "AM" && String(ev.horaFin).toUpperCase() === "PM") return 0;
  if (h === "AM") return 1; if (h === "PM") return 2; return 3;
}
function passFilters(ev){
  if (UI.fDepto && ev.depto !== UI.fDepto) return false;
  if (UI.fAlc && ev.alcance !== UI.fAlc) return false;
  if (UI.fTipo && ev.tipo !== UI.fTipo) return false;
  if (UI.q){ const q = UI.q.toUpperCase(); if (![ev.actividad,ev.responsable,ev.lugar,ev.participantes,ev.observaciones,ev.tipo].join(" ").toUpperCase().includes(q)) return false; }
  return true;
}
/* devuelve [{fecha, items:[{ev, marca, num}]}] para la semana */
function weekGuide(mon, onlyExt, filt){
  const sun = addDays(mon, 6); const days = [];
  for (let i=0;i<7;i++) days.push({fecha:addDays(mon,i), items:[]});
  S.events.forEach(ev=>{
    if (onlyExt && ev.alcance !== "EXT") return;
    if (filt && !passFilters(ev)) return;
    occurrences(ev, mon, sun, true).forEach(o=>{ days[daysBetween(mon,o.fecha)].items.push({ev, marca:o.marca}); });
  });
  days.forEach(d=>{
    d.items.sort((x,y)=> (horaKey(x.ev)-horaKey(y.ev)) || ((+x.ev.orden||0)-(+y.ev.orden||0)) || String(x.ev.creado).localeCompare(String(y.ev.creado)));
    const dd = parse(d.fecha).getDate(); d.items.forEach((it,i)=> it.num = `${pad(dd)}-${pad(i+1)}`);
  });
  return days;
}

/* planilla anual */
function fechaAnual(ev){
  const fi = ev.fechaInicio, ff = ev.fechaFin||fi, yi = fi.slice(0,4), yf = ff.slice(0,4);
  if (ev.recurrencia && ev.recurrencia.tipo !== "ninguna") return fi.slice(5)==="01-01" && ff.slice(5)==="12-31" && yi===yf ? yi : `${fmtC(fi)} – ${fmtC(ff)} ${yf}`;
  if (fi.slice(5)==="01-01" && ff.slice(5)==="12-31" && yi===yf) return yi;
  if (fi === ff) return fmtC(fi);
  return yi !== yf ? `${fmtC(fi)} ${yi} – ${fmtC(ff)} ${yf}` : `${fmtC(fi)} – ${fmtC(ff)}`;
}
function actAnual(ev){
  const parts = [];
  const rt = recurText(ev.recurrencia); parts.push((rt ? rt + ", " : "") + ev.actividad);
  if (ev.participantes && ev.participantes !== "-") parts.push("PARTICIPA: " + ev.participantes);
  if (ev.lugar && ev.lugar !== "A BORDO") parts.push("LUGAR: " + ev.lugar);
  obsLines(ev).forEach(o=> parts.push(o.replace(/\.$/,"")));
  return parts.join(" // ") + " //";
}
function annualRows(year){
  const ys = `${year}-01-01`, ye = `${year}-12-31`;
  const l = S.events.filter(ev=> ev.enAnual && passFilters(ev) && ev.fechaInicio <= ye && (ev.fechaFin||ev.fechaInicio) >= ys);
  const rec = l.filter(e=>e.recurrencia && e.recurrencia.tipo!=="ninguna"), whole = l.filter(e=>!rec.includes(e) && e.fechaInicio<=ys && (e.fechaFin||"")>=ye);
  const rest = l.filter(e=>!rec.includes(e) && !whole.includes(e)).sort((a,b)=> a.fechaInicio.localeCompare(b.fechaInicio) || (a.fechaFin||"").localeCompare(b.fechaFin||"") || a.actividad.localeCompare(b.actividad));
  return {fijos: whole.concat(rec), rest};
}
function viewAnual(){

    if (UI.ocultarPasados && past) return "";
    return `<tr class="r ${past?"past":""} ${ev.estado==="cancelado"?"cx":""}" data-id="${ev.id}"><td class="f">${fechaAnual(ev)}</td><td class="act">${esc(actAnual(ev))}${ev.alcance==="EXT"?` <span class="tag t-ext">▲ EXTERNA</span>`:""}</td><td class="t">${esc(ev.depto)}</td></tr>`; };
  let h = `<div class="toolbar"><h2>Planilla anual</h2><button class="btn sm" id="yPrev">◀</button><b>${year}</b><button class="btn sm" id="yNext">▶</button>
    <span class="small muted">${fijos.length+rest.length} actividades</span><div class="grow"></div>${filtersHTML()}
    <label class="small"><input type="checkbox" id="oPast" ${UI.ocultarPasados?"checked":""}> Ocultar pasados</label>

    <div class="small muted" style="margin-bottom:8px">Aquí queda todo lo que llega por mensaje, correo o instrucción durante el año, para no perder plazos. Los eventos con «Incluir en planilla anual» aparecen acá; los que además se muestran en la guía se publican automáticamente en su semana.</div>
    <table class="a"><thead><tr><th>FECHA</th><th>ACTIVIDAD</th><th>DEPTO.</th></tr></thead><tbody>`;
  if (fijos.length) h += `<tr class="mes"><td colspan="3">PERMANENTES / TODO EL AÑO</td></tr>` + fijos.map(row).join("");
  let mes = -1;
  rest.forEach(ev=>{ const m = ev.fechaInicio.slice(0,4) < String(year) ? 0 : +ev.fechaInicio.slice(5,7)-1; const r = row(ev); if (!r) return;

  $("#view").innerHTML = h + `</tbody></table>`;
  bindFilters(viewAnual);

/* ═══════════════ modal de evento ═══════════════ */
function openModal(html){ const m = $("#modal"); m.innerHTML = html; m.classList.add("on"); $$("[data-close]", m).forEach(b=> b.onclick = closeModal); m.onclick = e=>{ if (e.target === m) closeModal(); }; const f = $("input,select,textarea", m); if (f) setTimeout(()=>f.focus(), 30); }

/* actividades guardadas: orden alfabético, primero las del depto. del usuario */
function tplSorted(){
  const mine = ME ? ME.depto : "";
  return (S.plantillas||[]).slice().sort((a,b)=> ((a.depto===mine)?0:1) - ((b.depto===mine)?0:1) || String(a.depto).localeCompare(b.depto) || a.actividad.localeCompare(b.actividad));
}
const canEditTpl = t => !!ME && (ME.rol === "admin" || t.depto === ME.depto);
function tplHora(t){ return [t.horaInicio, t.horaFin].filter(Boolean).join("–"); }
function tplOptionsHTML(sel, withPlaceholder){
  const groups = {}; tplSorted().forEach(t=> (groups[t.depto||"—"] = groups[t.depto||"—"] || []).push(t));
  let h = withPlaceholder ? `<option value="" ${sel===""?"selected":""}>— Seleccione una actividad guardada —</option>` : "";
  Object.entries(groups).forEach(([d,l])=>{
    h += `<optgroup label="${esc(d)}">${l.map(t=>`<option value="${esc(t.id)}" ${sel===t.id?"selected":""}>${esc(t.actividad)}${tplHora(t)?"  ·  "+esc(tplHora(t)):""}</option>`).join("")}</optgroup>`;
  });
  return h + `<option value="__otra" ${sel==="__otra"?"selected":""}>✚ Otra — crear actividad desde cero</option>`;
}
function eventFromTpl(t, fecha){
  return {plantillaId:t.id, fechaInicio:fecha, fechaFin:fecha, horaInicio:t.horaInicio, horaFin:t.horaFin, actividad:t.actividad, responsable:t.responsable, lugar:t.lugar,
    participantes:t.participantes, observaciones:t.observaciones, alcance:t.alcance, mostrar:t.mostrar||"diario", enAnual:!!t.enAnual, depto:t.depto, ev:t.ev||"PT"};
}
function defaultDateForWeek(){ const t = todayIso(); return (t >= UI.week && t <= addDays(UI.week,6)) ? t : UI.week; }

  </div>
  <div class="mft">${!isNew&&editable?`<button class="btn danger" id="eDel">Eliminar</button>`:""}${!isNew&&ME?`<button class="btn" id="eDup" title="Crear una copia para otra fecha">Duplicar</button>`:""}<div class="grow"></div>
    <button class="btn" data-close>${editable?"Cancelar":"Cerrar"}</button>${editable?`<button class="btn pri" id="eSave">${isNew?"Crear":"Guardar cambios"}</button>`:""}</div></div>
  <datalist id="dlHora"><option>AM</option><option>PM</option><option>0800</option><option>0805</option><option>0830</option><option>0900</option><option>1000</option><option>1100</option><option>1200</option><option>1330</option><option>1400</option><option>1600</option><option>1800</option></datalist>
  <datalist id="dlResp">${(S.config.responsables||[]).map(x=>`<option>${esc(x)}</option>`).join("")}</datalist>
  <datalist id="dlLug">${(S.config.lugares||[]).map(x=>`<option>${esc(x)}</option>`).join("")}</datalist>`);

  /* ── menú de actividad ── */
  const setAlc = v => { $$("#alc input").forEach(i=> i.checked = i.value===v); $$("#alc label").forEach(l=> l.classList.toggle("on", l.querySelector("input").checked)); };
  const updTplLabel = ()=>{
    const w = $("#eTplW"); if (!w) return; const v = $("#eSel").value, t = tpls.find(x=>x.id===v);

    if (t && !canEditTpl(t)){ w.style.display = "none"; $("#eTpl").checked = false; return; }

  };
  $("#eSel").onchange = ()=>{
    const v = $("#eSel").value, t = tpls.find(x=>x.id===v);

    const extra = isNew ? $$("#multiW .md:checked:not(:disabled)").map(i=>i.value) : [];

      }
      closeModal(); await refresh();
      toast((isNew ? (extra.length ? `${extra.length+1} actividades creadas` : "Actividad creada") : "Cambios guardados") + tplMsg);
    } catch(x){ er.textContent = x.message; save.disabled = false; }
  };
  const del = $("#eDel");
  if (del) del.onclick = async ()=>{ if (!confirm(`¿Eliminar «${e.actividad}»?\nQuedará constancia en el registro de cambios.`)) return;
    try { await req("DELETE","/api/eventos/"+e.id); closeModal(); await refresh(); toast("Actividad eliminada"); } catch(x){ $("#eErr").textContent = x.message; } };
  const dup = $("#eDup");
  if (dup) dup.onclick = ()=>{ const c = Object.assign({}, ev); ["id","creado","creadoPor","modificado","modificadoPor"].forEach(k=>delete c[k]); if (ME.rol!=="admin") c.depto = ME.depto; openEvent(null, c); toast("Copia lista: ajuste la fecha y guarde"); };
  $$("[data-st]").forEach(b=> b.onclick = ()=> showSub(b.dataset.st));
  async function showSub(st){
    $$("[data-st]").forEach(x=> x.classList.toggle("on", x.dataset.st===st));
    $("#stDet").style.display = st==="det" ? "" : "none"; $("#stHist").style.display = st==="hist" ? "" : "none";
    if (st === "hist"){
      try { const l = await req("GET","/api/auditoria?doc="+encodeURIComponent(e.id));
        $("#stHist").innerHTML = l.length ? `<div class="hist">${l.map(x=>`<div><span class="mono small">${fmtTs(x.ts)}</span> · <b>${esc(x.usuario)}</b> · <span class="ac ${esc(x.accion)}">${esc(x.accion)}</span><br>${esc(x.resumen)}</div>`).join("")}</div>` : `<div class="empty">Sin historial</div>`;
      } catch(x){ $("#stHist").innerHTML = `<div class="empty">${esc(x.message)}</div>`; }
    }
  }
  if (startTab === "hist" && !isNew) showSub("hist");
}

function editGuardia(s){
  const cur = guardiaFor(s), ov = (S.config.guardiaOverrides||{})[s];

  req("PUT","/api/config",{guardiaOverrides:o}).then(refresh).catch(e=>toast(e.message,true));

    ${isNew?"":`<div class="f c12"><label><input type="checkbox" id="uA" ${u.activo!==false?"checked":""}> Cuenta activa</label></div>`}</div><div class="err" id="uE"></div></div>
    <div class="mft">${isNew?"":`<button class="btn danger" id="uDel">Eliminar</button>`}<div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="uOk">Guardar</button></div></div>`);
  $("#uOk").onclick = async ()=>{ const b = {nombre:$("#uN").value.trim(), depto:$("#uD").value, rol:$("#uR").value};
    if ($("#uP").value) b.clave = $("#uP").value; if (!isNew) b.activo = $("#uA").checked;
    try { if (isNew){ b.usuario = $("#uU").value.trim(); await req("POST","/api/usuarios",b); } else await req("PUT","/api/usuarios/"+encodeURIComponent(u.usuario),b);
      closeModal(); await refresh(); toast("Usuario guardado"); } catch(e){ $("#uE").textContent = e.message; } };
  const d = $("#uDel"); if (d) d.onclick = async ()=>{ if (!confirm(`¿Eliminar al usuario ${u.usuario}? Sus cambios anteriores siguen en el registro.`)) return;
    try { await req("DELETE","/api/usuarios/"+encodeURIComponent(u.usuario)); closeModal(); await refresh(); } catch(e){ $("#uE").textContent = e.message; } };
}
function admRespaldo(){
  $("#admB").innerHTML = `<h3>Respaldo y restauración</h3>
    <p class="small" style="margin-top:0">El respaldo incluye <b>todo</b>: eventos, confirmaciones de departamentos, versiones de semanas, configuración, departamentos, usuarios (con claves cifradas) y registro de cambios.</p>
    ${MODE==="carpeta"?`<p class="small muted">Además, el primer PC que abre la guía cada día deja una copia automática en <span class="mono">datos/respaldos/</span>, y se guarda otra antes de cada restauración. Copiar la carpeta completa de la guía también es un respaldo válido.</p>`:`<p class="small" style="color:var(--warn)">En este modo los datos viven solo en este navegador: descargue un respaldo al terminar cada sesión de trabajo.</p>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px"><button class="btn pri" id="rDown">Descargar respaldo (.json)</button>${MODE==="carpeta"?`<button class="btn" id="rSrv">Guardar copia en datos/respaldos ahora</button>`:""}</div>
    <h3>Restaurar / importar</h3>
    <div class="fg"><div class="f c8"><label>Archivo de respaldo (.json)</label><input type="file" id="rFile" accept=".json,application/json"></div>
    <div class="f c4"><label>Modo</label><select id="rMode"><option value="fusionar">Fusionar (agrega/actualiza eventos)</option><option value="reemplazar">Reemplazar todo</option></select></div></div>
    <div style="margin-top:12px"><button class="btn" id="rUp">Restaurar</button></div><div class="err" id="rE"></div>`;
  $("#rDown").onclick = async ()=>{ try { const d = await req("GET","/api/respaldo"); download(`respaldo_guia_semanal_${todayIso()}.json`, JSON.stringify(d,null,1), "application/json"); } catch(e){ toast(e.message,true); } };
  const s = $("#rSrv"); if (s) s.onclick = async ()=>{ try { const r = await req("POST","/api/respaldar"); toast("Copia creada: "+r.archivo); } catch(e){ toast(e.message,true); } };
  $("#rUp").onclick = async ()=>{ const f = $("#rFile").files[0]; if (!f) return $("#rE").textContent = "Elija un archivo.";
    let d; try { d = JSON.parse(await f.text()); } catch(e){ return $("#rE").textContent = "El archivo no es JSON válido."; }
    const modo = $("#rMode").value; if (modo==="reemplazar" && !confirm("Reemplazar TODO: se borrarán los eventos actuales y se cargarán los del archivo. ¿Continuar?")) return;
    try { const r = await req("POST","/api/restaurar",{datos:d, modo}); await refresh(); toast(`Restaurado: ${r.eventos} eventos`); } catch(e){ $("#rE").textContent = e.message; } };
}
function download(name, content, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ═══════════════ impresión y exportación a Word ═══════════════ */
const DOC_CSS = `@page{size:27.94cm 21.59cm;margin:1.4cm 1.2cm} @page Section1{size:11.0in 8.5in;mso-page-orientation:landscape;margin:1.4cm 1.2cm} div.Section1{page:Section1}
 body{font-family:Arial,Helvetica,sans-serif;font-size:8.5pt;color:#000} table{border-collapse:collapse;width:100%} td,th{border:1px solid #000;padding:2pt 4pt;vertical-align:top;font-size:8.5pt}
 th{background:#d9d9d9;font-weight:bold;text-align:center} .c{text-align:center} .day td{background:#1f3864;color:#fff;font-weight:bold;font-size:9.5pt} .cx td{text-decoration:line-through;color:#666}
 .hd td{border:1px solid #000;font-size:9pt} .ttl{text-align:center;font-weight:bold} .mes td{background:#e7e6e6;font-weight:bold} .firma{margin-top:26pt;text-align:center;width:240pt;margin-left:auto}
 h1{font-size:11pt;text-align:center;margin:10pt 0 6pt} tr{page-break-inside:avoid}`;
const B_ = "border:1px solid #000;padding:1pt 3pt;vertical-align:top;font-family:Arial;font-size:8.5pt";
const TD = (extra="", attrs="") => `<td ${attrs} style="${B_};${extra}">`;
const TH = (w="") => `<th style="${B_};background:#d9d9d9;font-weight:bold;text-align:center;${w?"width:"+w:""}">`;
const TBL = `<table border="1" cellspacing="0" cellpadding="1" width="100%" style="border-collapse:collapse;width:100%">`;
function docHeader(titulo){
  const w = weekNum(UI.week), sem = S.semanas.find(s=>s.id===weekId(UI.week)) || {}, c = S.config;
  return `${TBL}<tr>${TD("width:24%;font-size:9pt")}<b>${esc(c.institucion)}</b><br>${esc(c.buque)}<br>${esc(c.oficina)}</td>
    ${TD("width:56%;text-align:center;font-weight:bold;font-size:9.5pt")}${esc(titulo)} - SEMANA ${w.week}<br>DEL ${fmtC(UI.week)} AL ${fmtC(addDays(UI.week,6))}<br><span style="font-weight:normal;font-size:8.5pt">REF.: ${esc(c.referencia)}</span></td>
    ${TD("width:20%;text-align:right;font-size:9pt")}VERSIÓN ${esc(sem.version||"1.0")}</td></tr></table><br>`;
}
function docGuide(days, opts={}){
  const cols = opts.depto ? 8 : 7;
  const head = `<tr>${TH("7%")}EV</th>${TH("6%")}HORA</th>${TH("22%")}ACTIVIDAD</th>${TH("9%")}RESPONSABLE</th>${TH("10%")}LUGAR</th>${TH("15%")}PARTICIPANTES</th>${opts.depto?TH("8%")+"DEPTO.</th>":""}${TH()}OBSERVACIONES</th></tr>`;
  let h = "";
  days.forEach(d=>{ const g = guardiaFor(d.fecha);
    h += `${TBL}<tr>${TD("background:#1f3864;color:#ffffff;font-weight:bold;font-size:9.5pt",`colspan="${cols}" bgcolor="#1f3864"`)}${fmtLong(d.fecha)}${g?` &nbsp;—&nbsp; GUARDIA ${esc(g)}`:""}</td></tr>${head}`;
    if (!d.items.length) h += `<tr>${TD("text-align:center;font-style:italic",`colspan="${cols}"`)}S/A</td></tr>`;
    d.items.forEach(it=>{ const e = it.ev, ob = obsLines(e), cx = e.estado==="cancelado" ? "text-decoration:line-through;color:#666" : "";
      h += `<tr>${TD("text-align:center;"+cx)}${esc(e.ev||"PT")}<br>${it.num}</td>${TD("text-align:center;"+cx)}${horaHTML(e)}</td>${TD(cx)}${esc(e.actividad)}${it.marca?` (${it.marca})`:""}</td>${TD(cx)}${esc(e.responsable)}</td>${TD(cx)}${esc(e.lugar)}</td>${TD(cx)}${esc(e.participantes)}</td>${opts.depto?TD(cx)+esc(e.depto)+"</td>":""}${TD(cx)}${ob.length?ob.map((l,i)=>`${i+1}. ${esc(l)}`).join("<br>"):"1. S/O."}</td></tr>`; });
    h += `</table><br>`;
  });
  return h;
}
function docAnual(year){
  const {fijos, rest} = annualRows(year);
  const row = ev => { const cx = ev.estado==="cancelado" ? "text-decoration:line-through;color:#666" : ""; return `<tr>${TD("width:16%;font-weight:bold;"+cx)}${fechaAnual(ev)}</td>${TD(cx)}${esc(actAnual(ev))}</td></tr>`; };
  return `${TBL}<tr>${TH()}FECHA</th>${TH()}ACTIVIDAD — AÑO ${year}</th></tr>${fijos.map(row).join("")}${rest.map(row).join("")}</table>`;
}
function docFirma(){ const c = S.config; return (c.firmaNombre||c.firmaGrado) ? `<br><br><p style="text-align:right;font-family:Arial;font-size:9pt">______________________________<br>${esc(c.firmaNombre)}<br>${esc(c.firmaGrado)}<br>${esc(c.firmaCargo)}</p>` : ""; }
function exportDoc(kind, how){
  const w = weekNum(UI.week), year = +(kind==="anual" ? (UI.anualYear||UI.week.slice(0,4)) : UI.week.slice(0,4));
  let body = "", name = "";
  const rng = `del ${fmtC(UI.week)} al ${fmtC(addDays(UI.week,6))}`;
  if (kind === "interna"){
    let incl = true; if (how === "word") incl = confirm("¿Incluir la planilla anual al inicio del documento (como en el formato actual)?\n\nAceptar = sí · Cancelar = solo la semana");
    body = docHeader("GUÍA DE ACTIVIDADES SEMANAL INTERNA") + (incl ? docAnual(year) + "<br>" : "") + docGuide(weekGuide(UI.week,false,false)) + docFirma();
    name = `Guía Semanal Interna - SEMANA ${w.week} ${rng}`;
  } else if (kind === "mando"){
    const days = weekGuide(UI.week,true,false).filter(d=>d.items.length);
    body = docHeader("GUÍA DE ACTIVIDADES SEMANAL EXTERNA") + (days.length ? docGuide(days,{depto:true}) : "<p>Sin actividades externas.</p>") + docFirma();
    name = `Guía Semanal Externa - SEMANA ${w.week} ${rng}`;
  } else {
    body = `<h1>${esc(S.config.buque.toUpperCase())} — PLANILLA ANUAL DE ACTIVIDADES ${year}</h1>` + docAnual(year);
    name = `Planilla anual ${year}`;
  }
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(name)}</title>
    <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>${DOC_CSS}</style></head><body><div class="Section1">${body}</div></body></html>`;
  if (how === "word"){ download(name.replace(/[\\/:*?"<>|]/g,"") + ".doc", "﻿" + html, "application/msword"); toast("Documento Word descargado"); return; }
  const fr = $("#printframe"); const d = fr.contentDocument; d.open(); d.write(html); d.close();
  setTimeout(()=>{ fr.contentWindow.focus(); fr.contentWindow.print(); }, 250);
}

boot();
</script>
